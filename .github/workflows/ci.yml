name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build the web client
        run: npm run build -w @pagecast/web

  # The Swift sources cannot be compiled on Linux, so the wire contract they
  # depend on is checked separately and unconditionally. If the API changes
  # shape, this fails here rather than on someone's phone.
  ios-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 apps/ios/PagecastTests/Support/verify_fixtures.py
