# XcodeGen spec.
#
# The project is declared here rather than committed as a .pbxproj: that format
# is generated, effectively unreviewable in a diff, and conflicts on every
# concurrent change. Run `xcodegen generate` to produce Pagecast.xcodeproj.
#
#   brew install xcodegen && xcodegen generate && open Pagecast.xcodeproj

name: Pagecast
options:
  bundleIdPrefix: com.pagecast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Pagecast:
    type: application
    platform: iOS
    sources:
      - path: Pagecast
    settings:
      base:
        INFOPLIST_FILE: Pagecast/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pagecast.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PagecastShareExtension
        embed: true

  PagecastShareExtension:
    type: app-extension
    platform: iOS
    sources:
      # The extension posts to the same API, so it shares the client and the
      # model rather than carrying a second copy of either.
      - path: PagecastShareExtension
      - path: Pagecast/Networking
      - path: Pagecast/Models
    settings:
      base:
        INFOPLIST_FILE: PagecastShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pagecast.app.share

  PagecastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PagecastTests
        excludes:
          - "Support/**"
    # Captured server payloads, so decoding is tested against the real wire
    # format rather than something hand-written to match.
    resources:
      - path: PagecastTests/Fixtures
        type: folder
    dependencies:
      - target: Pagecast

schemes:
  Pagecast:
    build:
      targets:
        Pagecast: all
    test:
      targets:
        - PagecastTests
